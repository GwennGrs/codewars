[project]
name = "codewars"
version = "0.1.0"
description = ""
authors = [
    {name = "Garrigues",email = "gwenn.garrigues.etu@univ-lille.fr"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest (>=8.4.2,<9.0.0)",
    "coverage (>=7.10.7,<8.0.0)",
    "pylint (>=4.0.4,<5.0.0)",
    "marimo (>=0.18.4,<0.19.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "ruff (>=0.14.10,<0.15.0)"
]

[tool.poetry]
packages = [{include = "codewars", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage-badge (>=1.1.2,<2.0.0)"
]

[tool.marimo.ai]
rules = "- prefer polars over pandas\n- make charts using altair"

[tool.marimo.save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[tool.marimo.package_management]
manager = "poetry"